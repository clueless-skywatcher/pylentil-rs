[workspace]
resolver = "2"
members = [
    "crates/pylentil_common",
    "crates/pylentil_ast",
    "crates/pylentil_cli",
    "crates/pylentil_linter"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pylentil_common = { path = "crates/pylentil_common" }
pylentil_ast = { path = "crates/pylentil_ast" }
pylentil_linter = { path = "crates/pylentil_linter" }
